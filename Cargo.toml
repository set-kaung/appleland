[package]
name = "appleland"
version = "0.1.0"
edition = "2024"
publish = false


[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
envy = "0.4.2"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.3", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "rust_decimal",
    "time",
    "macros",
] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.5.3", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "ansi",
    "json",
] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tower_governor = "0.8.0"
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", features = [
    "postgres",
] }
tower-sessions = "0.15.0"
time = { version = "0.3", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "serde-human-readable",
    "parsing",
] }
argon2 = "0.5.3"
parse_duration = "2.1.1"
indoc = "2.0.7"
utoipa = { version = "5.5", features = ["uuid", "time", "decimal", "yaml"] }
clap = { version = "4.6.1", features = ["derive"] }
