openapi: 3.1.0
info:
  title: Appleland Admin API
  description: API for the admin dashboard. Endpoints require an authenticated staff session established via the login endpoint (session cookie named `id`).
  license:
    name: ''
  version: 0.9.0
paths:
  /admin/ai/chat:
    post:
      tags:
      - Admin AI Assistant
      description: |-
        Relay a prompt to the Gemini assistant. The request body is passed through unchanged and the
        Gemini response (status code and body) is returned unchanged. Only super admins may call this,
        and every admin has a per-day message limit.
      operationId: chat
      responses:
        '200':
          description: Gemini response relayed unchanged
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Super admin role required
        '429':
          description: Daily message limit exceeded
        '504':
          description: Upstream Gemini request timed out
      security:
      - session_cookie: []
  /admin/categories:
    get:
      tags:
      - Admin Categories
      description: Fetch every product category.
      operationId: get_all_categories
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Categories
      description: Create a new product category.
      operationId: create_category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPayload'
        required: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/categories/{id}:
    put:
      tags:
      - Admin Categories
      description: Update a product category name.
      operationId: update_category
      parameters:
      - name: id
        in: path
        description: Category UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryPayload'
        required: true
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Categories
      description: Soft delete a product category
      operationId: delete_category
      parameters:
      - name: id
        in: path
        description: Category UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Category (soft) deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCategoryResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/inventory/low-stock:
    get:
      tags:
      - Admin Inventory
      description: List products ordered by total stock ascending, flagged when stock is at or below the low-stock threshold.
      operationId: get_product_inventory_stock_level
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Products ordered by stock level
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLevel'
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/inventory/{product_id}:
    get:
      tags:
      - Admin Inventory
      description: List paginated inventory records for a product.
      operationId: get_product_inventory_records
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated inventory records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminInventory'
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Inventory
      description: Add inventory stock to an existing product.
      operationId: insert_inventory_record
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryPayload'
        required: true
      responses:
        '200':
          description: Inventory record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/login:
    post:
      tags:
      - Authentication
      description: Authenticate an admin and establish a session cookie.
      operationId: admin_login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated admin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: Invalid credentials
        '500':
          description: Internal server error
  /admin/logout:
    post:
      tags:
      - Authentication
      description: Destroy the current admin session.
      operationId: admin_logout_handler
      responses:
        '200':
          description: Session destroyed
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/orders:
    get:
      tags:
      - Admin Orders
      description: List paginated orders with optional status and date range filters.
      operationId: get_all_orders_paginated
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminOrderRow'
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/orders/update_status/{order_id}:
    patch:
      tags:
      - Admin Orders
      description: Update an order delivery status
      operationId: update_order_delivery_status
      parameters:
      - name: order_id
        in: path
        description: Order ID/UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order delivery status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderDeliveryStatusResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/orders/{order_id}:
    get:
      tags:
      - Admin Orders
      description: Get full admin order detail including items, customer, shipping address, payment info, and delivery status history.
      operationId: get_admin_order_detail
      parameters:
      - name: order_id
        in: path
        description: Order UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Admin order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Order not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    patch:
      tags:
      - Admin Orders
      description: Update an order tracking url.
      operationId: update_order_tracking_url_handler
      parameters:
      - name: order_id
        in: path
        description: Order UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderTrackingURLPayload'
        required: true
      responses:
        '200':
          description: Order tracking url updated
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/playground/checkout/{token_id}:
    get:
      tags:
      - Admin Playground
      description: Checkout data for a playground claim token from the admin side. Unclaimed tokens return `claim` = null. Claimed tokens return `claim` with the claiming user and computed total price.
      operationId: get_checkout_data_admin
      parameters:
      - name: token_id
        in: path
        description: Claim token id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Checkout Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundCheckoutDataAdmin'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/playground/purchases:
    get:
      tags:
      - Admin Playground
      description: 'Paginated list of playground ticket purchases, newest first. Optional filters: date range on Asia/Yangon calendar days (inclusive) and paid vs free redemption. `line_total` is quantity x unit_price for paid purchases and 0 for free redemptions.'
      operationId: get_admin_purchases_paginated
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: is_free_redemption
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of playground purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminPlaygroundPurchase'
        '400':
          description: Bad request - invalid or inverted date range
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/playground/summary:
    get:
      tags:
      - Admin Playground
      description: Daily playground ticket sales summary (paid tickets only) between the given dates, inclusive.
      operationId: get_ticket_sale_summary
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daily ticket sales summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSaleSummary'
        '400':
          description: Bad request - invalid or inverted date range
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/playground/tokens:
    post:
      tags:
      - Admin Playground
      description: Create a claim token for the frontend
      operationId: creat_playground_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimTokenPayload'
        required: true
      responses:
        '200':
          description: Claim token
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '401':
          description: Unauthorized - Missing or invalid Session Cookie
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products:
    get:
      tags:
      - Admin Products
      description: List all products (shown online or not) with pagination.
      operationId: get_products_paginated_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Products
      description: Create a new product and optionally seed its initial inventory.
      operationId: create_product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductPayload'
        required: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '409':
          description: Conflict - Product already exists
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products/all:
    get:
      tags:
      - Admin Products
      description: Fetch every product record without pagination.
      operationId: get_all_products
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products/search:
    get:
      tags:
      - Admin Products
      description: Simple admin product search by query string and optional category filter.
      operationId: search_products_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/search/advanced:
    post:
      tags:
      - Admin Products
      description: Advanced product search for admins with full filter support.
      operationId: search_products_admin_advanced
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchParamsAdmin'
        required: true
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/{product_id}:
    get:
      tags:
      - Admin Products
      description: Get a single product (admin view) by its UUID.
      operationId: get_product_by_id_admin
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    put:
      tags:
      - Admin Products
      description: 'Update an existing product. This is a full replace (PUT): every field in the request body overwrites the stored value, so clients must echo back fields they are not changing. In particular, omitting `original_price` or sending it as null removes any active discount, since a missing field on an optional payload deserializes to null.'
      operationId: update_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPayload'
        required: true
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Products
      description: Soft-delete a product by its UUID.
      operationId: delete_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Product soft-deleted
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales:
    get:
      tags:
      - Admin Sales
      description: List all sales with pagination. Each row includes `is_instore_sale` (channel) and `by_admin` (cashier, null for online sales).
      operationId: get_sales_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of sale records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminSale'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Sales
      description: Create a new sale (POS checkout) with FIFO inventory deduction. `payment_method` is optional and stored on the sale record (e.g. "Cash", "Card", "KPay"). When omitted, `sales.payment_method` is NULL.
      operationId: create_admin_sale
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminSalePayload'
        required: true
      responses:
        '201':
          description: Sale created
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid request or insufficient inventory
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales/summary:
    get:
      tags:
      - Admin Sales
      description: Aggregated daily sales summary with margin and basket metrics.
      operationId: sale_summary
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daily sales summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleSummary'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales/{sale_id}:
    get:
      tags:
      - Admin Sales
      description: Get full details of a single sale including its line items.
      operationId: get_sale_detail_by_id
      parameters:
      - name: sale_id
        in: path
        description: Sale UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Sale details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSaleDetails'
        '403':
          description: Forbidden - Missing or invalid session
        '404':
          description: Sale not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/staff:
    get:
      tags:
      - Admin Staff
      description: Get all staff
      operationId: get_all_admin_staff
      responses:
        '200':
          description: All staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminStaff'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/uploads:
    post:
      tags:
      - Uploads
      description: Upload an image to Supabase Storage. Send as multipart/form-data with a 'file' field.
      operationId: upload_image
      requestBody:
        description: Multipart form data with 'file' field
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Public file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/users:
    get:
      tags:
      - Admin Users
      description: List all users with pagination.
      operationId: get_all_users_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserResponse'
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
components:
  schemas:
    Admin:
      type: object
      required:
      - id
      - username
      - role
      - delivery_status_values
      properties:
        delivery_status_values:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        role:
