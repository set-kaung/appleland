openapi: 3.1.0
info:
  title: Appleland Admin API
  description: API for the admin dashboard. Endpoints require an authenticated admin session established via the login endpoint (session cookie named `id`).
  license:
    name: ''
  version: 0.8.0
paths:
  /admin/categories:
    get:
      tags:
      - Admin Categories
      description: Fetch every product category.
      operationId: get_all_categories
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Categories
      description: Create a new product category.
      operationId: create_category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPayload'
        required: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/categories/{id}:
    put:
      tags:
      - Admin Categories
      description: Update a product category name.
      operationId: update_category
      parameters:
      - name: id
        in: path
        description: Category UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryPayload'
        required: true
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Categories
      description: Soft delete a product category
      operationId: delete_category
      parameters:
      - name: id
        in: path
        description: Category UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Category (soft) deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCategoryResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/inventory/{product_id}:
    get:
      tags:
      - Admin Inventory
      description: List paginated inventory records for a product.
      operationId: get_product_inventory_records
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated inventory records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminInventory'
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Inventory
      description: Add inventory stock to an existing product.
      operationId: insert_inventory_record
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryPayload'
        required: true
      responses:
        '200':
          description: Inventory record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/login:
    post:
      tags:
      - Authentication
      description: Authenticate an admin and establish a session cookie.
      operationId: admin_login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated admin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: Invalid credentials
        '500':
          description: Internal server error
  /admin/logout:
    post:
      tags:
      - Authentication
      description: Destroy the current admin session.
      operationId: admin_logout_handler
      responses:
        '200':
          description: Session destroyed
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/orders/update_status/{order_id}:
    patch:
      tags:
      - Admin Orders
      description: Update an order delivery status
      operationId: update_order_delivery_status
      parameters:
      - name: order_id
        in: path
        description: Order ID/UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order delivery status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderDeliveryStatusResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/orders/{order_id}:
    patch:
      tags:
      - Admin Orders
      description: Update an order tracking url.
      operationId: update_order_tracking_url_handler
      parameters:
      - name: order_id
        in: path
        description: Order UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderTrackingURLPayload'
        required: true
      responses:
        '200':
          description: Order tracking url updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderTrackingURLPayload'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/playground/tokens:
    post:
      tags:
      - Admin Playground
      description: Create a claim token for the frontend
      operationId: creat_playground_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimTokenPayload'
        required: true
      responses:
        '200':
          description: Claim token
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '401':
          description: Unauthorized - Missing or invalid Session Cookie
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products:
    get:
      tags:
      - Admin Products
      description: List all products (active and inactive) with pagination.
      operationId: get_products_paginated_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Products
      description: Create a new product and optionally seed its initial inventory.
      operationId: create_product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductPayload'
        required: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '409':
          description: Conflict - Product already exists
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products/all:
    get:
      tags:
      - Admin Products
      description: Fetch every product record without pagination.
      operationId: get_all_products
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/products/search:
    get:
      tags:
      - Admin Products
      description: Simple admin product search by query string and optional category filter.
      operationId: search_products_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/search/advanced:
    post:
      tags:
      - Admin Products
      description: Advanced product search for admins with full filter support.
      operationId: search_products_admin_advanced
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchParamsAdmin'
        required: true
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/{product_id}:
    get:
      tags:
      - Admin Products
      description: Get a single product (admin view) by its UUID.
      operationId: get_product_by_id_admin
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '403':
          description: Forbidden - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    put:
      tags:
      - Admin Products
      description: Update an existing product.
      operationId: update_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPayload'
        required: true
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - Missing or invalid session
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Products
      description: Soft-delete a product by its UUID.
      operationId: delete_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Product soft-deleted
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales:
    get:
      tags:
      - Admin Sales
      description: List all sales with pagination.
      operationId: get_sales_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of sale records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminSale'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Sales
      description: Create a new sale (POS checkout) with FIFO inventory deduction.
      operationId: create_admin_sale
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserSalePayload'
        required: true
      responses:
        '201':
          description: Sale created
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid request or insufficient inventory
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales/summary:
    get:
      tags:
      - Admin Sales
      description: Aggregated daily sales summary with margin and basket metrics.
      operationId: sale_summary
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daily sales summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleSummary'
        '403':
          description: Forbidden - Missing or invalid session
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/sales/{sale_id}:
    get:
      tags:
      - Admin Sales
      description: Get full details of a single sale including its line items.
      operationId: get_sale_detail_by_id
      parameters:
      - name: sale_id
        in: path
        description: Sale UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Sale details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSaleDetails'
        '403':
          description: Forbidden - Missing or invalid session
        '404':
          description: Sale not found
        '500':
          description: Internal server error
      security:
      - session_cookie: []
  /admin/uploads:
    post:
      tags:
      - Uploads
      description: Upload an image to Supabase Storage. Send as multipart/form-data with a 'file' field.
      operationId: upload_image
      requestBody:
        description: Multipart form data with 'file' field
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Public file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearer: []
components:
  schemas:
    Admin:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AdminRole'
        username:
          type: string
    AdminCategory:
      type: object
      required:
      - id
      - name
      - created_by
      - created_at
      - updated_by
      - updated_at
      - is_deleted
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_by:
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: string
          format: uuid
        is_deleted:
          type: boolean
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminInventory:
      type: object
      required:
      - id
      - product_id
      - quantity_received
      - quantity_remaining
      - unit_cost
      - created_by
      - updated_by
      - created_at
      - updated_at
      - received_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        expiry_date:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity_received:
          type: integer
          format: int32
        quantity_remaining:
          type: integer
          format: int32
        received_at:
          type: string
          format: date-time
        unit_cost:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - is_active
      - selling_price
      - quantity_in_stock
      - created_at
      - updated_at
      - created_by
      - updated_by
      - is_perishable
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        is_perishable:
          type: boolean
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminRole:
      type: string
      enum:
      - sale_admin
      - playground_admin
      - super_admin
    AdminSale:
      type: object
      required:
      - id
      - total_amount
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        total_amount:
          type: string
    AdminSaleDetails:
      type: object
      required:
      - id
      - total_amount
      - created_at
      - sale_items
      - is_instore_sale
      properties:
        by_admin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SaleAdminDetail'
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        is_instore_sale:
          type: boolean
        sale_items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
        total_amount:
          type: string
    CreateAdminSalePayload:
      type: object
      required:
      - sale_products
      properties:
        sale_products:
          type: array
          items:
            $ref: '#/components/schemas/SaleProduct'
    CreateCategoryPayload:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateClaimTokenPayload:
      type: object
      required:
      - total_quantity
      - unit_price
      properties:
        total_quantity:
          type: integer
          format: int32
        unit_price:
          type: string
    CreateProductPayload:
      type: object
      required:
      - name
      - barcode
      - selling_price
      - is_active
      - is_perishable
      properties:
        barcode:
          type: string
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        inventory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NewInventoryPayload'
        is_active:
          type: boolean
        is_perishable:
          type: boolean
        name:
          type: string
        selling_price:
          type: string
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
    CreateUserSalePayload:
      type: object
      required:
      - payment_order_id
      - sale_products
      properties:
        payment_order_id:
          type: string
        sale_products:
          type: array
          items:
            $ref: '#/components/schemas/SaleProduct'
    DeleteCategoryResponse:
      type: object
      required:
      - id
      - is_deleted
      properties:
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_by:
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: string
          format: uuid
        is_deleted:
          type: boolean
    DeliveryStatus:
      type: string
      enum:
      - Pending
      - OnDelivery
      - Received
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    NewInventoryPayload:
      type: object
      required:
      - quantity_received
      - unit_cost
      properties:
        expiry_date:
          type:
          - string
          - 'null'
          format: date-time
        quantity_received:
          type: integer
          format: int32
        received_at:
          type:
          - string
          - 'null'
          format: date-time
        unit_cost:
          type: string
    PaginatedResponse_AdminInventory:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - product_id
            - quantity_received
            - quantity_remaining
            - unit_cost
            - created_by
            - updated_by
            - created_at
            - updated_at
            - received_at
            properties:
              created_at:
                type: string
                format: date-time
              created_by:
                type: string
                format: uuid
              expiry_date:
                type:
                - string
                - 'null'
                format: date-time
              id:
                type: string
                format: uuid
              product_id:
                type: string
                format: uuid
              quantity_received:
                type: integer
                format: int32
              quantity_remaining:
                type: integer
                format: int32
              received_at:
                type: string
                format: date-time
              unit_cost:
                type: string
