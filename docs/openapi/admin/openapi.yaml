openapi: 3.1.0
info:
  title: appleland
  description: API to be consumed by admin dashboard
  license:
    name: ''
  version: 0.1.0
paths:
  /admin/categories:
    get:
      tags:
      - Admin Categories
      operationId: get_all_categories
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
    post:
      tags:
      - Admin Categories
      operationId: create_category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPayload'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/categories/{id}:
    put:
      tags:
      - Admin Categories
      operationId: update_category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryPayload'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/inventory/{product_id}:
    post:
      tags:
      - Admin Inventory
      operationId: insert_inventory
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInventoryPayload'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventory'
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/login:
    post:
      tags:
      - Authentication
      operationId: admin_login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: ''
  /admin/logout:
    post:
      tags:
      - Authentication
      operationId: admin_logout_handler
      responses:
        '200':
          description: ''
      security:
      - session_cookie: []
  /admin/products:
    get:
      tags:
      - Admin Products
      operationId: get_products_paginated_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '500':
          description: Internal server error
    post:
      tags:
      - Admin Products
      operationId: create_product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductPayload'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/products/all:
    get:
      tags:
      - Admin Products
      operationId: get_all_products
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProduct'
        '401':
          description: ''
        '403':
          description: ''
      security:
      - session_cookie: []
  /admin/products/search:
    get:
      tags:
      - Admin Products
      operationId: find_products_admin
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully retrieved paginated admin products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters or JSON payload validation failed
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Requires admin privileges
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/search/advanced:
    post:
      tags:
      - Admin Products
      operationId: find_products_admin_advanced
      parameters:
      - name: page
        in: query
        description: The page number to retrieve (1-indexed)
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: limit
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          format: int64
        example: 10
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchParamsAdmin'
        required: true
      responses:
        '200':
          description: Successfully retrieved paginated admin products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminProduct'
        '400':
          description: Invalid query parameters or JSON payload validation failed
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Requires admin privileges
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /admin/products/{product_id}:
    get:
      tags:
      - Admin Products
      operationId: get_product_by_id_admin
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '404':
          description: Product not found
        '500':
          description: ''
    put:
      tags:
      - Admin Products
      operationId: update_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPayload'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Products
      operationId: delete_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: ''
        '404':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /api/products/{sale_id}:
    get:
      tags:
      - Admin Sales
      operationId: get_sale_detail_by_id
      parameters:
      - name: sale_id
        in: path
        description: Sale UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSaleDetails'
        '404':
          description: Sale Detail not found
        '500':
          description: ''
  /api/sales:
    get:
      tags:
      - Admin Sales
      operationId: get_sales_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of sale records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminSale'
        '500':
          description: Internal server error
components:
  schemas:
    Admin:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AdminRole'
        username:
          type: string
    AdminCategory:
      type: object
      required:
      - id
      - name
      - created_by
      - created_at
      - updated_by
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminInventory:
      type: object
      required:
      - id
      - product_id
      - quantity_received
      - quantity_remaining
      - unit_cost
      - created_by
      - updated_by
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity_received:
          type: integer
          format: int32
        quantity_remaining:
          type: integer
          format: int32
        unit_cost:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - is_active
      - selling_price
      - quantity_in_stock
      - created_at
      - updated_at
      - created_by
      - updated_by
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminRole:
      type: string
      enum:
      - sale_admin
      - playground_admin
      - super_admin
    AdminSale:
      type: object
      required:
      - id
      - total_amount
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        total_amount:
          type: string
    AdminSaleDetails:
      type: object
      required:
      - id
      - total_amount
      - created_at
      - sale_items
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        sale_items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
        total_amount:
          type: string
    CreateCategoryPayload:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateProductPayload:
      type: object
      required:
      - name
      - barcode
      - selling_price
      - is_active
      properties:
        barcode:
          type: string
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        inventory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NewInventoryPayload'
        is_active:
          type: boolean
        name:
          type: string
        selling_price:
          type: string
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    NewInventoryPayload:
      type: object
      required:
      - quantity_received
      - unit_cost
      properties:
        quantity_received:
          type: integer
          format: int32
        unit_cost:
          type: string
    PaginatedResponse_AdminProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - is_active
            - selling_price
            - quantity_in_stock
            - created_at
            - updated_at
            - created_by
            - updated_by
            properties:
              barcode:
                type: string
              category:
                type:
                - string
                - 'null'
              category_id:
                type:
                - string
                - 'null'
                format: uuid
              created_at:
                type: string
                format: date-time
              created_by:
                type: string
                format: uuid
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              image_url:
                type:
                - string
                - 'null'
              is_active:
                type: boolean
              name:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              selling_price:
                type: string
              sub_category:
                type:
                - string
                - 'null'
              sub_category_id:
                type:
                - string
                - 'null'
                format: uuid
              updated_at:
                type: string
                format: date-time
              updated_by:
                type: string
                format: uuid
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginatedResponse_AdminSale:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - total_amount
            - created_at
            properties:
              created_at:
                type: string
                format: date-time
              id:
                type: string
                format: uuid
              total_amount:
                type: string
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - selling_price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              image_url:
                type:
                - string
                - 'null'
              name:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              selling_price:
                type: string
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        page_size:
          type:
          - integer
          - 'null'
          format: int64
    ProductFilter:
      type: object
      required:
      - query
      properties:
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        query:
          type: string
    ProductSearchParams:
      type: object
      properties:
        barcode:
          type:
          - string
          - 'null'
        categories_id:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        max_price:
          type:
          - string
          - 'null'
        min_price:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        sub_categories_id:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
    ProductSearchParamsAdmin:
      allOf:
      - $ref: '#/components/schemas/ProductSearchParams'
      - type: object
        properties:
          is_active:
            type:
            - boolean
            - 'null'
    SaleItem:
      type: object
      required:
      - id
      - product_id
      - product_name
      - sale_id
      - quantity
      - selling_price
      - cost_price
      - created_at
      properties:
        cost_price:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
          format: int32
        sale_id:
          type: string
          format: uuid
        selling_price:
          type: string
    UpdateCategoryPayload:
      type: object
      required:
      - name
      - updated_by
      properties:
        name:
          type: string
        updated_by:
          type: string
          format: uuid
    UpdateProductPayload:
      type: object
      required:
      - barcode
      - name
      - category_id
      - is_active
      - selling_price
      properties:
        barcode:
          type: string
        category_id:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        name:
          type: string
        selling_price:
          type: string
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
    UserProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - selling_price
      - quantity_in_stock
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
tags:
- name: Admin Products
- name: Admin Categories
- name: Admin Sales
- name: Admin Inventory
- name: Authentication
