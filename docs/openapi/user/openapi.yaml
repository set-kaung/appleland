openapi: 3.1.0
info:
  title: Appleland User API
  description: 'Public API for storefront/user applications. All endpoints require a valid Supabase JWT supplied via the `Authorization: Bearer <token>` header.'
  license:
    name: ''
  version: 0.9.0
paths:
  /api/orders:
    get:
      tags:
      - User Orders
      description: List the current user's past orders (overview) with delivery status, order time and total amount, paginated.
      operationId: get_user_orders_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of the user's orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserOrderHistoryResponse'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/orders/{order_id}:
    get:
      tags:
      - User Orders
      description: 'Get the full detail of one of the current user''s orders: items, shipping address, payment info, delivery status, tracking url and status history. Returns 404 if the order does not exist or belongs to another user.'
      operationId: get_user_order_detail
      parameters:
      - name: order_id
        in: path
        description: Order UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrderDetail'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '404':
          description: Order not found
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/checkout/{token_id}:
    get:
      tags:
      - User Playground
      description: Checkout page data for a playground token
      operationId: get_checkout_data
      responses:
        '200':
          description: Claimed Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundCheckoutData'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/purchases:
    get:
      tags:
      - User Playground
      description: 'Paginated ticket purchase history of the authenticated user, newest first. Optional filters: date range on Asia/Yangon calendar days (inclusive) and paid vs free redemption. `line_total` is quantity x unit_price for paid purchases and 0 for free redemptions.'
      operationId: get_user_purchases_paginated
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: is_free_redemption
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated purchase history of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserPlaygroundPurchaseHistory'
        '400':
          description: Bad request - invalid or inverted date range
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/tickets:
    get:
      tags:
      - User Playground
      description: Get Tickets holdings of a User
      operationId: get_user_tickets
      responses:
        '200':
          description: Ticket holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlaygroundTickets'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/tickets/claim_free:
    patch:
      tags:
      - User Playground
      description: Claim a free ticket by a user
      operationId: claim_free_ticket
      responses:
        '200':
          description: Claimed Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlaygroundAccount'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/tokens/{token_id}:
    patch:
      tags:
      - User Playground
      description: Claim a ticket sale token by a user
      operationId: claim_token
      requestBody:
        description: Optional list of playground coupon IDs to redeem as free tickets. If omitted, no free tickets are redeemed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTokenPayload'
        required: true
      responses:
        '200':
          description: Claimed Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlaygroundPurchaseResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Missing or invalid JWT
        '410':
          description: Token Expired
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/products:
    get:
      tags:
      - Products
      description: List all products shown in the online store with pagination.
      operationId: get_products_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/products/search:
    get:
      tags:
      - Products
      description: Search the public product catalog by name, barcode, category, sub-category, and price range.
      operationId: search_products
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal database error
      security:
      - bearer: []
  /api/products/{product_id}:
    get:
      tags:
      - Products
      description: Get a single product by its UUID.
      operationId: get_product_by_id
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/sales:
    post:
      tags:
      - User Sales
      description: Create a new sale (checkout) with FIFO inventory deduction. In demo mode the payment confirmation check is skipped.
      operationId: create_user_sale
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserSalePayload'
        required: true
      responses:
        '201':
          description: Sale created
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid request or insufficient inventory
        '401':
          description: Unauthorized - Missing or invalid JWT
        '402':
          description: Payment not confirmed for order
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/users/setup:
    post:
      tags:
      - User
      description: Complete account setup for a newly signed-up user with address and phone number.
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserPayload'
        required: true
      responses:
        '200':
          description: Account setup completed successfully, returns user id
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '400':
          description: Bad request - Invalid input
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
components:
  schemas:
    ClaimTokenPayload:
      type: object
      properties:
        playground_coupons:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
    CreateUserPayload:
      type: object
      required:
      - username
      - address_line_1
      - phone_number
      properties:
        address_line_1:
          type: string
        phone_number:
          type: string
        username:
          type: string
    CreateUserSalePayload:
      type: object
      required:
      - payment_order_id
      - sale_products
      properties:
        payment_order_id:
          type: string
        sale_products:
          type: array
          items:
            $ref: '#/components/schemas/SaleProduct'
    OrderShippingAddress:
      type: object
      required:
      - address_line_1
      - phone_number
      properties:
        address_line_1:
          type: string
        phone_number:
          type: string
    PaginatedResponse_UserOrderHistoryResponse:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - delivery_status
            - created_at
            - total_amount
            properties:
              created_at:
                type: string
                format: date-time
              delivery_status:
                type: string
              id:
                type: string
                format: uuid
              total_amount:
                type: string
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginatedResponse_UserPlaygroundPurchaseHistory:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - user_id
            - quantity
            - unit_price
            - is_free_redemption
            - line_total
            - created_at
            properties:
              created_at:
                type: string
                format: date-time
              id:
                type: string
                format: uuid
              is_free_redemption:
                type: boolean
              line_total:
                type: string
              quantity:
                type: integer
                format: int32
              unit_price:
                type: string
              user_id:
                type: string
                format: uuid
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - selling_price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              image_url:
                type:
                - string
                - 'null'
              name:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              selling_price:
                type: string
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        page_size:
          type:
          - integer
          - 'null'
          format: int64
    PlaygroundCheckoutData:
      type: object
      required:
      - total_quantity
      - unit_price
      - total_price
      - available_coupons
      properties:
        available_coupons:
          type: array
          items:
            type: string
            format: uuid
        total_price:
          type: string
        total_quantity:
          type: integer
          format: int32
        unit_price:
          type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    ProductFilter:
      type: object
      required:
      - query
      properties:
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        query:
          type: string
    SaleProduct:
      type: object
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
    UserOrderDetail:
      type: object
      required:
      - id
      - delivery_status
      - total_amount
      - shipping_address
      - items
      - status_history
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        delivery_status:
          type: string
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserOrderItem'
        order_tracking_url:
          type:
          - string
          - 'null'
        payment_method:
          type:
          - string
          - 'null'
        payment_provider:
          type:
          - string
          - 'null'
        shipping_address:
          $ref: '#/components/schemas/OrderShippingAddress'
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/UserOrderStatusEntry'
        total_amount:
          type: string
    UserOrderHistoryResponse:
      type: object
      required:
      - id
      - delivery_status
      - created_at
      - total_amount
      properties:
        created_at:
          type: string
          format: date-time
        delivery_status:
          type: string
        id:
          type: string
          format: uuid
        total_amount:
          type: string
    UserOrderItem:
      type: object
      required:
      - product_id
      - product_name
      - quantity
      - selling_price
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
          format: int32
        selling_price:
          type: string
    UserOrderStatusEntry:
      type: object
      required:
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        status:
          type: string
    UserPlaygroundAccount:
      type: object
      required:
      - user_id
      - tickets_purchased
      - free_tickets_redeemed
      - free_ticket_eligible
      properties:
        free_ticket_eligible:
          type: integer
          format: int32
        free_tickets_redeemed:
          type: integer
          format: int32
        tickets_purchased:
          type: integer
          format: int32
        user_id:
          type: string
          format: uuid
    UserPlaygroundPurchase:
      type: object
      required:
      - id
      - user_id
      - quantity
      - is_free_redemption
      properties:
        id:
          type: string
          format: uuid
        is_free_redemption:
          type: boolean
        quantity:
          type: integer
          format: int32
        user_id:
          type: string
          format: uuid
    UserPlaygroundPurchaseHistory:
      type: object
      required:
      - id
      - user_id
      - quantity
      - unit_price
      - is_free_redemption
      - line_total
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        is_free_redemption:
          type: boolean
        line_total:
          type: string
        quantity:
          type: integer
          format: int32
        unit_price:
          type: string
        user_id:
          type: string
          format: uuid
    UserPlaygroundPurchaseResponse:
      type: object
      properties:
        free_record:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPlaygroundPurchase'
        purchased_record:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPlaygroundPurchase'
    UserPlaygroundPurchasesQuery:
      type: object
      properties:
        end_date:
          type:
          - string
          - 'null'
          format: date
        is_free_redemption:
          type:
          - boolean
          - 'null'
        page:
          type:
          - integer
          - 'null'
          format: int64
        page_size:
          type:
          - integer
          - 'null'
          format: int64
        start_date:
          type:
          - string
          - 'null'
          format: date
    UserPlaygroundTickets:
      type: object
      required:
      - user_id
      - tickets_purchased
      - free_tickets_redeemed
      - free_ticket_eligible
      properties:
        free_ticket_eligible:
          type: integer
          format: int32
        free_tickets_redeemed:
          type: integer
          format: int32
        tickets_purchased:
          type: integer
          format: int32
        user_id:
          type: string
          format: uuid
    UserProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - selling_price
      - quantity_in_stock
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
tags:
- name: Products
  description: Browse and search the product catalog
- name: User Playground
  description: Playground tickets, eligibility, claim
- name: User
  description: User account management
- name: User Sales
  description: Checkout and sales for users
- name: User Orders
  description: Order history and delivery tracking for users
