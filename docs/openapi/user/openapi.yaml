openapi: 3.1.0
info:
  title: Appleland User API
  description: 'Public API for storefront/user applications. All endpoints require a valid Supabase JWT supplied via the `Authorization: Bearer <token>` header.'
  license:
    name: ''
  version: 0.1.0
paths:
  /api/playground/tickets:
    get:
      tags:
      - User Playground
      description: Get Tickets History of a User
      operationId: get_user_tickets
      responses:
        '200':
          description: Ticket History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlaygroundTickets'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/playground/tokens/{token_id}:
    patch:
      tags:
      - User Playground
      description: Claim a ticket sale token by a user
      operationId: claim_token
      responses:
        '200':
          description: Ticket Token Claimed
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '401':
          description: Unauthorized - Missing or invalid JWT
        '410':
          description: Token Expired
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/products:
    get:
      tags:
      - Products
      description: List all active products with pagination.
      operationId: get_products_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal server error
      security:
      - bearer: []
  /api/products/search:
    get:
      tags:
      - Products
      description: Search the public product catalog by name, barcode, category, sub-category, and price range.
      operationId: search_products
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated list of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '500':
          description: Internal database error
      security:
      - bearer: []
  /api/products/{product_id}:
    get:
      tags:
      - Products
      description: Get a single product by its UUID.
      operationId: get_product_by_id
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '401':
          description: Unauthorized - Missing or invalid JWT
        '403':
          description: Forbidden - Insufficient privileges
        '404':
          description: Product not found
        '500':
          description: Internal server error
      security:
      - bearer: []
components:
  schemas:
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - selling_price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              image_url:
                type:
                - string
                - 'null'
              name:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              selling_price:
                type: string
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        page_size:
          type:
          - integer
          - 'null'
          format: int64
    ProductFilter:
      type: object
      required:
      - query
      properties:
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        query:
          type: string
    UserPlaygroundTickets:
      type: object
      required:
      - user_id
      - tickets_purchased
      - free_tickets_redeemed
      - to_redeem
      properties:
        free_tickets_redeemed:
          type: integer
          format: int32
        tickets_purchased:
          type: integer
          format: int32
        to_redeem:
          type: integer
          format: int32
        user_id:
          type: string
          format: uuid
    UserProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - selling_price
      - quantity_in_stock
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
tags:
- name: Products
  description: Browse and search the product catalog
