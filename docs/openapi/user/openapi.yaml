openapi: 3.1.0
info:
  title: appleland
  description: API to be consumed by user applications
  license:
    name: ''
  version: 0.1.0
paths:
  /api/products:
    get:
      tags:
      - Products
      operationId: get_products_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '500':
          description: Internal server error
  /api/products/search:
    post:
      tags:
      - Products
      operationId: find_products
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchParams'
        required: true
      responses:
        '200':
          description: Successfully retrieved paginated admin products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '400':
          description: Invalid query parameters or JSON payload validation failed
        '401':
          description: Unauthorized - Missing or invalid session
        '403':
          description: Forbidden - Requires admin privileges
        '500':
          description: Internal database error
      security:
      - session_cookie: []
  /api/products/{product_id}:
    get:
      tags:
      - Products
      operationId: get_product_by_id
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '404':
          description: Product not found
        '500':
          description: ''
components:
  schemas:
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - selling_price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              image_url:
                type:
                - string
                - 'null'
              name:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              selling_price:
                type: string
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        page_size:
          type:
          - integer
          - 'null'
          format: int64
    ProductFilter:
      type: object
      required:
      - query
      properties:
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        query:
          type: string
    ProductSearchParams:
      type: object
      properties:
        barcode:
          type:
          - string
          - 'null'
        categories_id:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        max_price:
          type:
          - string
          - 'null'
        min_price:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        sub_categories_id:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
    UserProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - selling_price
      - quantity_in_stock
      properties:
        barcode:
          type: string
        category:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        image_url:
          type:
          - string
          - 'null'
        name:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        selling_price:
          type: string
        sub_category:
          type:
          - string
          - 'null'
tags:
- name: Products
