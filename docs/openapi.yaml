openapi: 3.1.0
info:
  title: appleland
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /api/products:
    get:
      tags:
      - Products
      operationId: get_products_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_UserProduct'
        '500':
          description: Internal server error
  /api/products/{product_id}:
    get:
      tags:
      - Products
      operationId: get_product_by_id
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProduct'
        '404':
          description: Product not found
        '500':
          description: ''
components:
  schemas:
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - category
            - price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type: string
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              name:
                type: string
              price:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        per_page:
          type:
          - integer
          - 'null'
          format: int64
    UserProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - category
      - price
      - quantity_in_stock
      properties:
        barcode:
          type: string
        category:
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        sub_category:
          type:
          - string
          - 'null'
tags:
- name: Products
