get:
  summary: List products
  operationId: apiListProducts
  tags:
    - Products (API)
  security:
    - bearerAuth: []
  parameters:
    - $ref: ../components/parameters/Page.yml
    - $ref: ../components/parameters/PageSize.yml
  responses:
    '200':
      description: Paginated product list
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PaginatedProducts.yml
    '401':
      $ref: ../components/responses/Unauthorized.yml
    '500':
      $ref: ../components/responses/InternalError.yml
