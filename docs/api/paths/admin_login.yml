post:
  summary: Admin login
  description: |
    Validates username/password with Argon2. On success, inserts `id` and
    `role` into the server-side session and returns a Set-Cookie header.
  operationId: adminLogin
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yml
  responses:
    "200":
      description: Login successful — session cookie set
      headers:
        Set-Cookie:
          description: |
            Contains the session identifier. By default, tower_sessions names this cookie `id`.
            Example: `id=0189e34b...; Path=/; HttpOnly; SameSite=Lax`
          schema:
            type: string
    "401":
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorMessage.yml
    "500":
      $ref: ../components/responses/InternalError.yml
