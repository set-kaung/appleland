type: object
required:
  - id
  - barcode
  - name
  - category
  - is_active
  - price
properties:
  id:
    type: string
    format: uuid
    description: Must match the product being updated; used by the store layer.
  barcode:
    type: string
  name:
    type: string
  description:
    type: string
    nullable: true
  category:
    type: string
  sub_category:
    type: string
    nullable: true
  is_active:
    type: boolean
  price:
    type: string
    format: decimal
    example: '199.99'
