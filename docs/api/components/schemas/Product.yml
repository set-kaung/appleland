type: object
required:
  - id
  - barcode
  - name
  - category
  - is_active
  - price
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  barcode:
    type: string
  name:
    type: string
  description:
    type: string
    nullable: true
  category:
    type: string
  sub_category:
    type: string
    nullable: true
  is_active:
    type: boolean
  price:
    type: string
    format: decimal
    description: |
      Arbitrary-precision decimal (rust_decimal). Serialized as a string
      to avoid float precision loss.
    example: '199.99'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
