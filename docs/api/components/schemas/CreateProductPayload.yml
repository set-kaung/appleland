type: object
required:
  - name
  - barcode
  - category
  - is_active
  - price
properties:
  name:
    type: string
  barcode:
    type: string
  description:
    type: string
    nullable: true
  category:
    type: string
  sub_category:
    type: string
    nullable: true
  is_active:
    type: boolean
  price:
    type: string
    format: decimal
    example: '199.99'
