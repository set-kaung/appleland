openapi: 3.1.0
info:
  title: Appleland API
  version: 0.1.0
tags:
  - name: Auth
    description: Admin session management
  - name: Products (API)
    description: Product reads for authenticated API users — /api/products
  - name: Products (Admin)
    description: Full product CRUD for admin users — /admin/products
paths:
  /admin/login:
    $ref: paths/admin_login.yml
  /admin/logout:
    $ref: paths/admin_logout.yml
  /api/products:
    $ref: paths/api_products.yml
  /api/products/{productId}:
    $ref: paths/api_products_{productId}.yml
  /admin/products:
    $ref: paths/admin_products.yml
  /admin/products/{productId}:
    $ref: paths/admin_products_{productId}.yml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued to API users; validated by user_auth_middleware
    sessionCookie:
      type: apiKey
      in: cookie
      name: id
      description: |
        Server-side session cookie set on POST /admin/login.
        Session stores `id` (admin UUID) and `role` (admin role string),
        validated by admin_auth_middleware.
