openapi: 3.1.0
info:
  title: appleland
  description: API to be consumed by admin dashboar
  license:
    name: ''
  version: 0.1.0
paths:
  /admin/categories:
    post:
      tags:
      - Admin Categories
      operationId: create_category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPayload'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/inventory/{product_id}:
    put:
      tags:
      - Admin Products
      operationId: update_inventory
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryPayload'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/login:
    post:
      tags:
      - Authentication
      operationId: admin_login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: ''
  /admin/logout:
    post:
      tags:
      - Authentication
      operationId: admin_logout_handler
      responses:
        '200':
          description: ''
      security:
      - session_cookie: []
  /admin/products:
    post:
      tags:
      - Admin Products
      operationId: create_product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductPayload'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /admin/products/all:
    get:
      tags:
      - Admin Products
      operationId: get_all_products
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProduct'
        '401':
          description: ''
        '403':
          description: ''
      security:
      - session_cookie: []
  /admin/products/{product_id}:
    put:
      tags:
      - Admin Products
      operationId: update_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPayload'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
    delete:
      tags:
      - Admin Products
      operationId: delete_product
      parameters:
      - name: product_id
        in: path
        description: Product UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: ''
        '404':
          description: ''
        '409':
          description: ''
        '500':
          description: ''
      security:
      - session_cookie: []
  /api/products/{sale_id}:
    get:
      tags:
      - Sales
      operationId: get_sale_detail_by_id
      parameters:
      - name: sale_id
        in: path
        description: Sale UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSaleDetails'
        '404':
          description: Sale Detail not found
        '500':
          description: ''
  /api/sales:
    get:
      tags:
      - Sales
      operationId: get_sales_paginated
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated list of sale records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminSale'
        '500':
          description: Internal server error
components:
  schemas:
    Admin:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AdminRole'
        username:
          type: string
    AdminCategory:
      type: object
      required:
      - id
      - name
      - created_by
      - created_at
      - updated_by
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminProduct:
      type: object
      required:
      - id
      - barcode
      - name
      - category_id
      - category
      - is_active
      - price
      - quantity_in_stock
      - created_at
      - updated_at
      - created_by
      - updated_by
      properties:
        barcode:
          type: string
        category:
          type: string
        category_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        is_active:
          type: boolean
        name:
          type: string
        price:
          type: string
        quantity_in_stock:
          type: integer
          format: int32
        sub_category:
          type:
          - string
          - 'null'
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    AdminRole:
      type: string
      enum:
      - SaleAdmin
      - PlaygroundAdmin
      - SuperAdmin
    AdminSale:
      type: object
      required:
      - id
      - total_amount
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        total_amount:
          type: string
    AdminSaleDetails:
      type: object
      required:
      - id
      - total_amount
      - created_at
      - sale_items
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        sale_items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
        total_amount:
          type: string
    CreateCategoryPayload:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateProductPayload:
      type: object
      required:
      - name
      - barcode
      - category_id
      - is_active
      - price
      properties:
        barcode:
          type: string
        category_id:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        name:
          type: string
        price:
          type: string
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
    Inventory:
      type: object
      required:
      - id
      - product_id
      - quantity
      - created_by
      - updated_by
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    PaginatedResponse_AdminSale:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - total_amount
            - created_at
            properties:
              created_at:
                type: string
                format: date-time
              id:
                type: string
                format: uuid
              total_amount:
                type: string
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginatedResponse_UserProduct:
      type: object
      required:
      - data
      - total_items
      - total_pages
      - current_page
      properties:
        current_page:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            required:
            - id
            - barcode
            - name
            - category
            - price
            - quantity_in_stock
            properties:
              barcode:
                type: string
              category:
                type: string
              description:
                type:
                - string
                - 'null'
              id:
                type: string
                format: uuid
              name:
                type: string
              price:
                type: string
              quantity_in_stock:
                type: integer
                format: int32
              sub_category:
                type:
                - string
                - 'null'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    PaginationQuery:
      type: object
      properties:
        page:
          type:
          - integer
          - 'null'
          format: int64
        per_page:
          type:
          - integer
          - 'null'
          format: int64
    SaleItem:
      type: object
      required:
      - id
      - product_id
      - product_name
      - sale_id
      - quantity
      - selling_price
      - cost_price
      - created_at
      properties:
        cost_price:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
          format: int32
        sale_id:
          type: string
          format: uuid
        selling_price:
          type: string
    UpdateInventoryPayload:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          format: int32
    UpdateProductPayload:
      type: object
      required:
      - barcode
      - name
      - category_id
      - is_active
      - price
      properties:
        barcode:
          type: string
        category_id:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        name:
          type: string
        price:
          type: string
        sub_category_id:
          type:
          - string
          - 'null'
          format: uuid
tags:
- name: Admin Products
- name: Authentication
