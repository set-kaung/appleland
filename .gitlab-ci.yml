rust-build:
  stage: test
  image: rust:1.97-slim
  script:
    - cargo build --verbose
    - cargo test --verbose

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp docs/index.html docs/user.html docs/admin.html public/
    - mkdir -p public/openapi/user public/openapi/admin
    - cp docs/openapi/user/openapi.yaml public/openapi/user/
    - cp docs/openapi/admin/openapi.yaml public/openapi/admin/
  artifacts:
    paths:
      - public
  only:
    - dev