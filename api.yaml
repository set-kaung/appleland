openapi: 3.1.0
info:
  title: Appleland API
  version: 0.1.0

tags:
  - name: Auth
    description: Admin session management
  - name: Products (API)
    description: Product reads for authenticated API users — /api/products
  - name: Products (Admin)
    description: Full product CRUD for admin users — /admin/products

paths:
  /admin/login:
    post:
      summary: Admin login
      description: |
        Validates username/password with Argon2. On success, inserts `id` and
        `role` into the server-side session and returns a Set-Cookie header.
      operationId: adminLogin
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful — session cookie set
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/logout:
    post:
      summary: Admin logout
      description: Deletes the current server-side session.
      operationId: adminLogout
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session deleted
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── API routes (/api/products) — JWT bearer, read-only ───────────────────

  /api/products:
    get:
      summary: List products
      operationId: apiListProducts
      tags: [Products (API)]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/products/{productId}:
    get:
      summary: Get product by ID
      operationId: apiGetProductById
      tags: [Products (API)]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Admin routes (/admin/products) — session auth, full CRUD ─────────────

  /admin/products:
    get:
      summary: List products (admin)
      operationId: adminListProducts
      tags: [Products (Admin)]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create a product
      description: Requires the `SaleAdmin` role stored in the session.
      operationId: adminCreateProduct
      tags: [Products (Admin)]
      security:
        - sessionCookie: []
      x-required-role: SaleAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductPayload'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Required field missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Authenticated but role is insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: A product with the given barcode already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/products/{productId}:
    get:
      summary: Get product by ID (admin)
      operationId: adminGetProductById
      tags: [Products (Admin)]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      summary: Update a product
      description: |
        The product `id` must be present in the request body; the path
        `{productId}` is used for routing only.
      operationId: adminUpdateProduct
      tags: [Products (Admin)]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPayload'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete a product
      operationId: adminDeleteProduct
      tags: [Products (Admin)]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
        '409':
          description: Safety trigger — attempted to delete more than one row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued to API users; validated by user_auth_middleware

    sessionCookie:
      type: apiKey
      in: cookie
      name: id
      description: |
        Server-side session cookie set on POST /admin/login.
        Session stores `id` (admin UUID) and `role` (admin role string),
        validated by admin_auth_middleware.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the product

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Product:
      type: object
      required:
        - id
        - barcode
        - name
        - category
        - is_active
        - price
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        sub_category:
          type: string
          nullable: true
        is_active:
          type: boolean
        price:
          type: string
          format: decimal
          description: |
            Arbitrary-precision decimal (rust_decimal). Serialized as a string
            to avoid float precision loss.
          example: "199.99"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProductPayload:
      type: object
      required:
        - name
        - barcode
        - category
        - is_active
        - price
      properties:
        name:
          type: string
        barcode:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        sub_category:
          type: string
          nullable: true
        is_active:
          type: boolean
        price:
          type: string
          format: decimal
          example: "199.99"

    UpdateProductPayload:
      type: object
      required:
        - id
        - barcode
        - name
        - category
        - is_active
        - price
      properties:
        id:
          type: string
          format: uuid
          description: Must match the product being updated; used by the store layer.
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        sub_category:
          type: string
          nullable: true
        is_active:
          type: boolean
        price:
          type: string
          format: decimal
          example: "199.99"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    PaginatedProducts:
      type: object
      required:
        - data
        - total_items
        - total_pages
        - current_page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total_items:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        current_page:
          type: integer
          format: int64

    ErrorMessage:
      type: object
      properties:
        message:
          type: string

  responses:
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'